{{define "base"}}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->

    <title>ArchiTree</title>

    <!-- Core CSS -->

    <link rel="stylesheet" href="/static/css/core/vars.css">
    <link rel="stylesheet" href="/static/css/core/reset.css">
    <link rel="stylesheet" href="/static/css/core/layout.css">
    <link rel="stylesheet" href="/static/css/components/topbar.css">
    <link rel="stylesheet" href="/static/css/components/sidebar.css">
    <link rel="stylesheet" href="/static/css/components/page.css">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="/static/lib/font-awesome/css/all.min.css">
</head>
<body>
    <!-- App -->

    <div class="app" x-data="app()">
        <!-- Topbar -->

        <header class="topbar">{{template "topbar" .}}</header>

        <!-- App Layout -->

        <div class="app-layout">
            <!-- Sidebar -->

            <aside class="sidebar">{{template "sidebar" .}}</aside>

            <!-- App Content -->

            <main class="app-layout__content" tabindex="-1">
                {{template "page" .}}
            </main>
        </div>
    </div>

    <!-- JS -->

    <script defer src="/static/js/core/api.js"></script>
    <script defer src="/static/js/lib/d3.v7.min.js"></script>
    <script defer src="/static/js/components/tree.js"></script>
    <script defer src="/static/js/components/tree-visual.js"></script>
    <script defer src="/static/js/components/chart.js"></script>
    <script defer src="/static/js/components/tests.js"></script>
    <script defer src="/static/js/core/main.js"></script>
    <script defer src="/static/js/lib/alpine.min.js"></script>
</body>
</html>

{{end}}
